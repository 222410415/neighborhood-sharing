name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: corepack enable && corepack prepare pnpm@12.6.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @neighborhood/contracts build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm --filter @neighborhood/api build
      - run: pnpm --filter @neighborhood/web build
